# Cloudflare-proxied origin for the Sender API and web application.
# Keep this server_name aligned with the Cloudflare DNS record.
server {
    listen 146.59.18.243:443 ssl;
    http2 on;
    server_name chydo.lol;

    include /etc/nginx/snippets/security-headers.conf;
    access_log /var/log/nginx/sender-api.access.log main;
    error_log /var/log/nginx/sender-api.error.log warn;

    ssl_certificate "/etc/ssl/gitea.chydo.dev/fullchain.pem";
    ssl_certificate_key "/etc/ssl/gitea.chydo.dev/private.pem";
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SenderApiSSL:10m;
    ssl_session_tickets off;

    # Trust the client-IP header only when the request came from Cloudflare.
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 131.0.72.0/22;
    set_real_ip_from 2400:cb00::/32;
    set_real_ip_from 2606:4700::/32;
    set_real_ip_from 2803:f800::/32;
    set_real_ip_from 2405:b500::/32;
    set_real_ip_from 2405:8100::/32;
    set_real_ip_from 2a06:98c0::/29;
    set_real_ip_from 2c0f:f248::/32;
    real_ip_header CF-Connecting-IP;
    real_ip_recursive on;

    client_max_body_size 10m;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Port $server_port;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;

    location = /health {
        proxy_pass http://127.0.0.1:8080;
        proxy_read_timeout 5s;
        add_header Cache-Control "no-store" always;
    }

    location = /readyz {
        proxy_pass http://127.0.0.1:8080;
        proxy_read_timeout 5s;
        add_header Cache-Control "no-store" always;
    }

    location = /metrics {
        proxy_pass http://127.0.0.1:8080;
        proxy_read_timeout 5s;
        add_header Cache-Control "no-store" always;
    }

    location ^~ /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_read_timeout 35s;
        proxy_send_timeout 35s;
        proxy_buffering off;
        proxy_cache_bypass 1;
        proxy_no_cache 1;
        add_header Cache-Control "no-store" always;
    }

    location ~ /\.(?!well-known) {
        deny all;
        access_log off;
        log_not_found off;
    }

    location / {
        proxy_pass http://127.0.0.1:3004;
        proxy_read_timeout 35s;
        proxy_send_timeout 35s;
        proxy_buffering off;
    }
}

server {
    listen 80;
    server_name chydo.lol;
    return 301 https://$host$request_uri;
}
