openapi: 3.1.0
info:
  title: Sender API
  version: 0.1.0
  description: Multi-tenant email API backed by Amazon SES.
servers:
  - url: http://localhost:8080/api/v1
security:
  - bearerAuth: []
paths:
  /dashboard/summary:
    get:
      summary: Get the current workspace overview
      parameters:
        - $ref: '#/components/parameters/TeamID'
      responses:
        '200': { description: Workspace overview, content: { application/json: { schema: { $ref: '#/components/schemas/DashboardSummary' } } } }
        '503': { $ref: '#/components/responses/Unavailable' }
  /unsubscribe/{token}:
    parameters:
      - name: token
        in: path
        required: true
        schema: { type: string }
    get:
      summary: Show the unsubscribe confirmation page
      security: []
      responses:
        '200': { description: Confirmation page, content: { text/html: {} } }
    post:
      summary: One-click unsubscribe
      security: []
      responses:
        '204': { description: Unsubscribed }
        '400': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /emails:
    get:
      summary: List emails
      parameters:
        - $ref: '#/components/parameters/TeamID'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200': { $ref: '#/components/responses/EmailList' }
    post:
      summary: Queue an email
      parameters:
        - $ref: '#/components/parameters/TeamID'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody: { $ref: '#/components/requestBodies/SendEmail' }
      responses:
        '201': { $ref: '#/components/responses/EmailCreated' }
        '200': { $ref: '#/components/responses/EmailCreated' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /emails/batch:
    post:
      summary: Queue multiple emails
      parameters:
        - $ref: '#/components/parameters/TeamID'
        - $ref: '#/components/parameters/RequiredIdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              maxItems: 100
              items: { $ref: '#/components/schemas/SendEmailRequest' }
      responses:
        '201': { $ref: '#/components/responses/JSON' }
        '207': { $ref: '#/components/responses/JSON' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /emails/dead-letters:
    get:
      summary: List failed queue items for the current team
      parameters:
        - $ref: '#/components/parameters/TeamID'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200': { $ref: '#/components/responses/JSON' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /emails/dead-letters/{id}/replay:
    parameters:
      - $ref: '#/components/parameters/ID'
      - $ref: '#/components/parameters/TeamID'
    post:
      summary: Replay a failed queue item
      responses:
        '202': { $ref: '#/components/responses/JSON' }
        '400': { $ref: '#/components/responses/Error' }
  /emails/{id}:
    parameters:
      - $ref: '#/components/parameters/ID'
      - $ref: '#/components/parameters/TeamID'
    get:
      summary: Get an email
      responses: { '200': { $ref: '#/components/responses/JSON' } }
    delete:
      summary: Cancel a queued email
      responses: { '204': { description: Cancelled } }
  /emails/{id}/events:
    parameters:
      - $ref: '#/components/parameters/ID'
      - $ref: '#/components/parameters/TeamID'
    get:
      summary: List email events
      responses: { '200': { $ref: '#/components/responses/JSON' } }
  /teams:
    get:
      summary: List teams for the current user
      responses: { '200': { $ref: '#/components/responses/JSON' } }
    post:
      summary: Create a team
      requestBody: { $ref: '#/components/requestBodies/JSON' }
      responses: { '201': { $ref: '#/components/responses/JSON' } }
  /teams/{id}:
    parameters: [ { $ref: '#/components/parameters/ID' } ]
    get:
      summary: Get a team
      responses: { '200': { $ref: '#/components/responses/JSON' } }
    patch:
      summary: Rename a team
      requestBody: { $ref: '#/components/requestBodies/JSON' }
      responses: { '200': { $ref: '#/components/responses/JSON' } }
    delete:
      summary: Delete a team
      responses: { '204': { description: Deleted } }
  /teams/{id}/members:
    parameters: [ { $ref: '#/components/parameters/ID' } ]
    get:
      summary: List team members
      responses: { '200': { $ref: '#/components/responses/JSON' } }
  /teams/{id}/members/{userId}:
    parameters:
      - $ref: '#/components/parameters/ID'
      - name: userId
        in: path
        required: true
        schema: { type: string, format: uuid }
    delete:
      summary: Remove a team member
      responses: { '204': { description: Removed } }
  /teams/{id}/members/{userId}/role:
    parameters:
      - $ref: '#/components/parameters/ID'
      - name: userId
        in: path
        required: true
        schema: { type: string, format: uuid }
    patch:
      summary: Change a team member role
      requestBody: { $ref: '#/components/requestBodies/JSON' }
      responses: { '204': { description: Updated } }
  /teams/{id}/invite:
    parameters: [ { $ref: '#/components/parameters/ID' } ]
    post:
      summary: Create a single-use team invitation
      requestBody: { $ref: '#/components/requestBodies/JSON' }
      responses: { '201': { $ref: '#/components/responses/JSON' } }
  /teams/{id}/invitations:
    parameters: [ { $ref: '#/components/parameters/ID' } ]
    get:
      summary: List team invitations
      responses: { '200': { $ref: '#/components/responses/JSON' } }
  /teams/{id}/invitations/{invitationId}:
    parameters:
      - $ref: '#/components/parameters/ID'
      - name: invitationId
        in: path
        required: true
        schema: { type: string, format: uuid }
    delete:
      summary: Revoke a pending team invitation
      responses: { '204': { description: Revoked } }
  /teams/invitations/accept:
    post:
      summary: Accept a team invitation for the authenticated user
      requestBody: { $ref: '#/components/requestBodies/JSON' }
      responses: { '200': { $ref: '#/components/responses/JSON' } }
  /contacts:
    get:
      summary: List contacts
      parameters: [ { $ref: '#/components/parameters/TeamID' }, { $ref: '#/components/parameters/Limit' }, { $ref: '#/components/parameters/Offset' } ]
      responses: { '200': { $ref: '#/components/responses/JSON' } }
    post:
      summary: Create a contact
      parameters: [ { $ref: '#/components/parameters/TeamID' } ]
      requestBody: { $ref: '#/components/requestBodies/JSON' }
      responses: { '201': { $ref: '#/components/responses/JSON' } }
  /contacts/import:
    post:
      summary: Import contacts from CSV
      parameters: [ { $ref: '#/components/parameters/TeamID' } ]
      requestBody:
        required: true
        content:
          multipart/form-data: { schema: { type: object, required: [file], properties: { file: { type: string, format: binary } } } }
      responses: { '201': { $ref: '#/components/responses/JSON' } }
  /contacts/{id}:
    parameters: [ { $ref: '#/components/parameters/ID' }, { $ref: '#/components/parameters/TeamID' } ]
    get:
      summary: Get a contact
      responses: { '200': { $ref: '#/components/responses/JSON' } }
    patch:
      summary: Update a contact
      requestBody: { $ref: '#/components/requestBodies/JSON' }
      responses: { '200': { $ref: '#/components/responses/JSON' } }
    delete:
      summary: Delete a contact
      responses: { '204': { description: Deleted } }
  /domains:
    get:
      summary: List sender domains
      parameters: [ { $ref: '#/components/parameters/TeamID' } ]
      responses: { '200': { $ref: '#/components/responses/JSON' } }
    post:
      summary: Claim a sender domain
      parameters: [ { $ref: '#/components/parameters/TeamID' } ]
      requestBody: { $ref: '#/components/requestBodies/JSON' }
      responses: { '201': { $ref: '#/components/responses/JSON' } }
  /domains/{id}/verify:
    parameters:
      - $ref: '#/components/parameters/ID'
      - $ref: '#/components/parameters/TeamID'
    post:
      summary: Verify DNS records for a domain
      responses: { '204': { description: Verification complete } }
  /domains/{id}:
    parameters: [ { $ref: '#/components/parameters/ID' }, { $ref: '#/components/parameters/TeamID' } ]
    get:
      summary: Get a sender domain
      responses: { '200': { $ref: '#/components/responses/JSON' } }
    delete:
      summary: Delete a sender domain
      responses: { '204': { description: Deleted } }
  /api-keys:
    get:
      summary: List API keys
      parameters: [ { $ref: '#/components/parameters/TeamID' } ]
      responses: { '200': { $ref: '#/components/responses/JSON' } }
    post:
      summary: Create an API key
      parameters: [ { $ref: '#/components/parameters/TeamID' } ]
      requestBody: { $ref: '#/components/requestBodies/JSON' }
      responses: { '201': { $ref: '#/components/responses/JSON' } }
  /api-keys/{id}:
    parameters: [ { $ref: '#/components/parameters/ID' }, { $ref: '#/components/parameters/TeamID' } ]
    delete:
      summary: Revoke an API key
      responses: { '204': { description: Revoked } }
  /webhooks:
    get:
      summary: List webhooks
      parameters: [ { $ref: '#/components/parameters/TeamID' } ]
      responses: { '200': { $ref: '#/components/responses/JSON' } }
    post:
      summary: Create a webhook
      parameters: [ { $ref: '#/components/parameters/TeamID' } ]
      requestBody: { $ref: '#/components/requestBodies/JSON' }
      responses: { '201': { $ref: '#/components/responses/JSON' } }
  /webhooks/{id}:
    parameters: [ { $ref: '#/components/parameters/ID' }, { $ref: '#/components/parameters/TeamID' } ]
    get:
      summary: Get a webhook
      responses: { '200': { $ref: '#/components/responses/JSON' } }
    patch:
      summary: Update or disable a webhook
      requestBody: { $ref: '#/components/requestBodies/JSON' }
      responses: { '200': { $ref: '#/components/responses/JSON' } }
    delete:
      summary: Delete a webhook
      responses: { '204': { description: Deleted } }
  /webhooks/{id}/deliveries:
    parameters:
      - $ref: '#/components/parameters/ID'
      - $ref: '#/components/parameters/TeamID'
      - $ref: '#/components/parameters/Limit'
    get:
      summary: List recent webhook delivery attempts
      responses: { '200': { $ref: '#/components/responses/JSON' } }
  /webhooks/{id}/test:
    parameters:
      - $ref: '#/components/parameters/ID'
      - $ref: '#/components/parameters/TeamID'
    post:
      summary: Queue a test webhook delivery
      responses:
        '202': { $ref: '#/components/responses/JSON' }
        '409': { $ref: '#/components/responses/Conflict' }
  /inbound:
    get:
      summary: List inbound emails
      parameters: [ { $ref: '#/components/parameters/TeamID' }, { $ref: '#/components/parameters/Limit' }, { $ref: '#/components/parameters/Offset' } ]
      responses: { '200': { $ref: '#/components/responses/JSON' } }
  /inbound/{id}:
    parameters: [ { $ref: '#/components/parameters/ID' }, { $ref: '#/components/parameters/TeamID' } ]
    get:
      summary: Get a parsed inbound email
      responses: { '200': { $ref: '#/components/responses/JSON' } }
  /billing:
    get:
      summary: Get the current team billing state
      parameters: [ { $ref: '#/components/parameters/TeamID' } ]
      responses: { '200': { $ref: '#/components/responses/JSON' } }
  /billing/checkout:
    post:
      summary: Create a Stripe checkout session
      parameters: [ { $ref: '#/components/parameters/TeamID' } ]
      requestBody: { $ref: '#/components/requestBodies/JSON' }
      responses:
        '200': { $ref: '#/components/responses/JSON' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /billing/portal:
    post:
      summary: Create a Stripe customer portal session
      parameters: [ { $ref: '#/components/parameters/TeamID' } ]
      responses:
        '200': { $ref: '#/components/responses/JSON' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /inbound/ses:
    post:
      summary: Receive an SES inbound SNS notification
      security: []
      responses:
        '200': { $ref: '#/components/responses/JSON' }
        '401': { $ref: '#/components/responses/Error' }
  /webhooks/ses:
    post:
      summary: Receive an SES outbound event notification
      security: []
      responses:
        '200': { $ref: '#/components/responses/JSON' }
        '401': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /webhooks/stripe:
    post:
      summary: Receive a verified Stripe subscription event
      security: []
      parameters:
        - name: Stripe-Signature
          in: header
          required: true
          schema: { type: string }
      responses:
        '200': { $ref: '#/components/responses/JSON' }
        '400': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT or re_ API key
  parameters:
    ID: { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    TeamID: { name: X-Team-ID, in: header, required: false, description: Required for JWT requests; API keys already identify their team., schema: { type: string, format: uuid } }
    IdempotencyKey: { name: Idempotency-Key, in: header, required: false, schema: { type: string, maxLength: 255 } }
    RequiredIdempotencyKey: { name: Idempotency-Key, in: header, required: true, schema: { type: string, minLength: 1, maxLength: 255 } }
    Limit: { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
    Offset: { name: offset, in: query, schema: { type: integer, minimum: 0, default: 0 } }
  requestBodies:
    JSON:
      required: true
      content: { application/json: { schema: { type: object } } }
    SendEmail:
      required: true
      content: { application/json: { schema: { $ref: '#/components/schemas/SendEmailRequest' } } }
  responses:
    JSON: { description: JSON response, content: { application/json: { schema: {} } } }
    Error: { description: Error response, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    EmailList: { description: Email list, content: { application/json: { schema: { type: object } } } }
    EmailCreated: { description: Queued email, content: { application/json: { schema: { $ref: '#/components/schemas/EmailResponse' } } } }
    Conflict: { description: Idempotency conflict, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    RateLimited: { description: Daily recipient or request rate limit exceeded, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    Unavailable: { description: Queue or usage limiter unavailable, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  schemas:
    SendEmailRequest:
      type: object
      required: [from, to, subject]
      properties:
        from: { type: string, format: email }
        to: { type: array, minItems: 1, maxItems: 50, items: { type: string, format: email } }
        cc: { type: array, items: { type: string, format: email } }
        bcc: { type: array, items: { type: string, format: email } }
        subject: { type: string, maxLength: 998 }
        category: { type: string, enum: [transactional, marketing], default: transactional, description: Marketing messages require one recipient, verified DMARC, and automatically receive RFC 2369/8058 unsubscribe headers. }
        text: { type: string }
        html: { type: string }
        reply_to: { type: array, items: { type: string, format: email } }
        headers: { type: object, additionalProperties: { type: string } }
        metadata: { type: object, additionalProperties: { type: string } }
        tags: { type: array, items: { type: object } }
        attachments: { type: array, items: { type: object } }
        scheduled_at: { type: string, format: date-time }
    DashboardSummary:
      type: object
      required: [status, status_label, alerts, domains, delivery, audience, webhooks, activity]
      properties:
        status: { type: string, enum: [ready, attention, action_needed] }
        status_label: { type: string }
        alerts: { type: array, items: { type: object } }
        domains: { type: array, items: { type: object } }
        delivery: { type: object }
        audience: { type: object }
        webhooks: { type: object }
        activity: { type: array, items: { type: object } }
    EmailResponse:
      type: object
      required: [id]
      properties:
        id: { type: string, format: uuid }
        idempotent: { type: boolean }
    Error:
      type: object
      required: [error]
      properties:
        error: { type: string }
