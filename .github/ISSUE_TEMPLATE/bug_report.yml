name: Bug report
description: Report a reproducible problem safely
title: "bug: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Remove credentials, tokens, personal data, and production payloads before submitting.
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe the observed behavior and the expected behavior.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Provide the smallest safe request, logs, or steps to reproduce.
      placeholder: |
        1. Configure ...
        2. Run ...
        3. Observe ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include versions and deployment mode, but redact secrets.
      placeholder: Go, Node.js, OS, Docker/host process, database/Redis version

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      render: shell
  - type: input
    id: version
    attributes:
      label: Version or commit
    validations:
      required: true
