name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.26.x"
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Check formatting
        run: test -z "$(find cmd internal pkg -type f -name '*.go' -exec gofmt -l {} +)"

      - name: Test
        run: go test ./cmd/... ./internal/... ./pkg/...

      - name: Race test
        run: go test -race ./cmd/... ./internal/... ./pkg/...

      - name: Vet
        run: go vet ./cmd/... ./internal/... ./pkg/...

      - name: Build
        run: go build ./cmd/...

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24.x"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Oxlint
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

  compose:
    name: Compose configuration
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Validate production Compose configuration
        run: >-
          CORS_ORIGINS=https://app.example.com
          SUPABASE_URL=https://project.supabase.co
          METRICS_TOKEN=ci-metrics-token
          POSTGRES_PASSWORD=ci-postgres-password
          NEXT_PUBLIC_API_URL=https://api.example.com
          NEXT_PUBLIC_SUPABASE_URL=https://project.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY=ci-anon-key
          docker compose config --quiet

      - name: Validate development Compose configuration
        run: docker compose -f docker-compose.dev.yml config --quiet

      - name: Apply migrations to a clean PostgreSQL container
        run: |
          trap 'docker compose -f docker-compose.dev.yml down -v' EXIT
          docker compose -f docker-compose.dev.yml up -d db
          ready=0
          for attempt in $(seq 1 30); do
            if docker compose -f docker-compose.dev.yml exec -T db pg_isready -U supabase_admin -d sender_api; then
              ready=1
              break
            fi
            sleep 2
          done
          test "$ready" -eq 1
          docker compose -f docker-compose.dev.yml exec -T db psql -U supabase_admin -d sender_api -v ON_ERROR_STOP=1 -c "SELECT 1 FROM webhook_deliveries LIMIT 1"
          docker compose -f docker-compose.dev.yml exec -T db psql -U supabase_admin -d sender_api -v ON_ERROR_STOP=1 -c "SELECT 1 FROM pg_indexes WHERE indexname = 'ux_emails_team_idempotency_key'"
          docker compose -f docker-compose.dev.yml exec -T db psql -U supabase_admin -d sender_api -v ON_ERROR_STOP=1 -c "SELECT 1 FROM information_schema.columns WHERE table_name = 'emails' AND column_name = 'sending_at'"
          docker compose -f docker-compose.dev.yml exec -T db psql -U supabase_admin -d sender_api -v ON_ERROR_STOP=1 -c "SELECT 9 AS version, false AS dirty FROM public.schema_migrations WHERE version = 9 AND dirty = false"
          docker compose -f docker-compose.dev.yml exec -T db psql -U supabase_admin -d sender_api -v ON_ERROR_STOP=1 -c "SELECT 1 FROM information_schema.columns WHERE table_name = 'domains' AND column_name = 'mx_status'"
          docker compose -f docker-compose.dev.yml exec -T db psql -U supabase_admin -d sender_api -v ON_ERROR_STOP=1 -c "SELECT 1 FROM information_schema.columns WHERE table_name = 'teams' AND column_name = 'billing_status'"
          docker compose -f docker-compose.dev.yml exec -T db psql -U supabase_admin -d sender_api -v ON_ERROR_STOP=1 -c "SELECT 1 FROM information_schema.tables WHERE table_name = 'suppressions'"
          docker compose -f docker-compose.dev.yml exec -T db psql -U supabase_admin -d sender_api -v ON_ERROR_STOP=1 -c "SELECT 1 FROM information_schema.tables WHERE table_name = 'team_invitations'"
          docker compose -f docker-compose.dev.yml exec -T db psql -U supabase_admin -d sender_api -v ON_ERROR_STOP=1 -c "INSERT INTO teams (id, name, slug) VALUES ('00000000-0000-0000-0000-000000000001', 'migration-check', 'migration-check'); DELETE FROM teams WHERE id = '00000000-0000-0000-0000-000000000001'"
