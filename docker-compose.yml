services:
  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    ports:
      - "127.0.0.1:${API_HOST_PORT:-8080}:8080"
    environment:
      PORT: ${PORT:-8080}
      ENV: production
      DEBUG: "false"
      CORS_ORIGINS: ${CORS_ORIGINS:?CORS_ORIGINS must be set to the public HTTPS web origin}
      DATABASE_URL: ${COMPOSE_DATABASE_URL:-postgresql://${APP_DB_USER:-sender_api_app}:${APP_DB_PASSWORD:?APP_DB_PASSWORD must be set}@db:5432/sender_api}
      DB_MAX_CONNS: ${DB_MAX_CONNS:-4}
      DB_MIN_CONNS: ${DB_MIN_CONNS:-0}
      REDIS_URL: ${COMPOSE_REDIS_URL:-redis:6379}
      REDIS_POOL_SIZE: ${REDIS_POOL_SIZE:-4}
      AWS_REGION: ${AWS_REGION:?AWS_REGION must be set}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_SES_CONFIGSET: ${AWS_SES_CONFIGSET:-}
      OUTBOUND_SES_TOPIC_ARN: ${OUTBOUND_SES_TOPIC_ARN:-}
      REQUIRE_OUTBOUND_SES_EVENTS: ${REQUIRE_OUTBOUND_SES_EVENTS:-false}
      PUBLIC_API_URL: ${PUBLIC_API_URL:-}
      UNSUBSCRIBE_SIGNING_SECRET: ${UNSUBSCRIBE_SIGNING_SECRET:-}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_PRICE_PRO: ${STRIPE_PRICE_PRO:-}
      STRIPE_PRICE_SCALE: ${STRIPE_PRICE_SCALE:-}
      STRIPE_SUCCESS_URL: ${STRIPE_SUCCESS_URL:-http://localhost:3000/settings/billing?success=1}
      STRIPE_CANCEL_URL: ${STRIPE_CANCEL_URL:-http://localhost:3000/settings/billing?cancelled=1}
      STRIPE_RETURN_URL: ${STRIPE_RETURN_URL:-http://localhost:3000/settings/billing}
      SUPABASE_URL: ${SUPABASE_URL:?SUPABASE_URL must be set to an HTTPS Supabase URL}
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_TRACES_SAMPLE_RATE: ${SENTRY_TRACES_SAMPLE_RATE:-0}
      METRICS_TOKEN: ${METRICS_TOKEN:?METRICS_TOKEN must be set}
      DAILY_RECIPIENT_LIMIT: ${DAILY_RECIPIENT_LIMIT:-1000}
      INBOUND_S3_BUCKET: ${INBOUND_S3_BUCKET:-sender-api-inbound}
      INBOUND_SQS_QUEUE_URL: ${INBOUND_SQS_QUEUE_URL:-}
      INBOUND_SNS_TOPIC_ARN: ${INBOUND_SNS_TOPIC_ARN:-}
      INBOUND_WEBHOOK_TOKEN: ${INBOUND_WEBHOOK_TOKEN:-}
      INBOUND_SQS_VISIBILITY_TIMEOUT_SECONDS: ${INBOUND_SQS_VISIBILITY_TIMEOUT_SECONDS:-120}
      EMAIL_RETENTION_DAYS: ${EMAIL_RETENTION_DAYS:-90}
      INBOUND_RETENTION_DAYS: ${INBOUND_RETENTION_DAYS:-30}
    depends_on:
      migrate:
        condition: service_completed_successfully
      db-role:
        condition: service_completed_successfully
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: ${API_PIDS_LIMIT:-128}
    mem_limit: ${API_MEM_LIMIT:-512m}
    cpus: ${API_CPUS:-1.0}
    healthcheck:
      test: ["CMD-SHELL", "wget -q -T 3 -O /dev/null http://localhost:8080/readyz"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - sender-api

  worker:
    build:
      context: .
      dockerfile: docker/Dockerfile.worker
    environment:
      ENV: production
      DEBUG: "false"
      CORS_ORIGINS: ${CORS_ORIGINS:?CORS_ORIGINS must be set to the public HTTPS web origin}
      DATABASE_URL: ${COMPOSE_DATABASE_URL:-postgresql://${APP_DB_USER:-sender_api_app}:${APP_DB_PASSWORD:?APP_DB_PASSWORD must be set}@db:5432/sender_api}
      DB_MAX_CONNS: ${DB_MAX_CONNS:-4}
      DB_MIN_CONNS: ${DB_MIN_CONNS:-0}
      REDIS_URL: ${COMPOSE_REDIS_URL:-redis:6379}
      REDIS_POOL_SIZE: ${REDIS_POOL_SIZE:-4}
      WORKER_POLL_INTERVAL: ${WORKER_POLL_INTERVAL:-5s}
      WORKER_HEALTH_PORT: ${WORKER_HEALTH_PORT:-8090}
      AWS_REGION: ${AWS_REGION:?AWS_REGION must be set}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_SES_CONFIGSET: ${AWS_SES_CONFIGSET:-}
      OUTBOUND_SES_TOPIC_ARN: ${OUTBOUND_SES_TOPIC_ARN:-}
      REQUIRE_OUTBOUND_SES_EVENTS: ${REQUIRE_OUTBOUND_SES_EVENTS:-false}
      PUBLIC_API_URL: ${PUBLIC_API_URL:-}
      UNSUBSCRIBE_SIGNING_SECRET: ${UNSUBSCRIBE_SIGNING_SECRET:-}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_PRICE_PRO: ${STRIPE_PRICE_PRO:-}
      STRIPE_PRICE_SCALE: ${STRIPE_PRICE_SCALE:-}
      STRIPE_SUCCESS_URL: ${STRIPE_SUCCESS_URL:-http://localhost:3000/settings/billing?success=1}
      STRIPE_CANCEL_URL: ${STRIPE_CANCEL_URL:-http://localhost:3000/settings/billing?cancelled=1}
      STRIPE_RETURN_URL: ${STRIPE_RETURN_URL:-http://localhost:3000/settings/billing}
      SUPABASE_URL: ${SUPABASE_URL:?SUPABASE_URL must be set to an HTTPS Supabase URL}
      METRICS_TOKEN: ${METRICS_TOKEN:?METRICS_TOKEN must be set}
      INBOUND_S3_BUCKET: ${INBOUND_S3_BUCKET:-sender-api-inbound}
      INBOUND_SQS_QUEUE_URL: ${INBOUND_SQS_QUEUE_URL:-}
      INBOUND_SNS_TOPIC_ARN: ${INBOUND_SNS_TOPIC_ARN:-}
      INBOUND_WEBHOOK_TOKEN: ${INBOUND_WEBHOOK_TOKEN:-}
      INBOUND_SQS_VISIBILITY_TIMEOUT_SECONDS: ${INBOUND_SQS_VISIBILITY_TIMEOUT_SECONDS:-120}
      EMAIL_RETENTION_DAYS: ${EMAIL_RETENTION_DAYS:-90}
      INBOUND_RETENTION_DAYS: ${INBOUND_RETENTION_DAYS:-30}
    depends_on:
      migrate:
        condition: service_completed_successfully
      db-role:
        condition: service_completed_successfully
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: ${WORKER_PIDS_LIMIT:-128}
    mem_limit: ${WORKER_MEM_LIMIT:-512m}
    cpus: ${WORKER_CPUS:-1.0}
    healthcheck:
      test: ["CMD-SHELL", "wget -q -T 3 -O /dev/null http://127.0.0.1:$${WORKER_HEALTH_PORT:-8090}/readyz"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - sender-api

  web:
    build:
      context: web
      dockerfile: ../docker/Dockerfile.web
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:?NEXT_PUBLIC_API_URL must be set}
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:?NEXT_PUBLIC_SUPABASE_URL must be set}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY:?NEXT_PUBLIC_SUPABASE_ANON_KEY must be set}
    ports:
      - "127.0.0.1:${WEB_HOST_PORT:-3004}:3000"
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:?NEXT_PUBLIC_API_URL must be set}
      NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:?NEXT_PUBLIC_SUPABASE_URL must be set}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY:?NEXT_PUBLIC_SUPABASE_ANON_KEY must be set}
    depends_on:
      api:
        condition: service_started
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: ${WEB_PIDS_LIMIT:-128}
    mem_limit: ${WEB_MEM_LIMIT:-256m}
    cpus: ${WEB_CPUS:-0.25}
    healthcheck:
      test: ["CMD-SHELL", "wget -q -T 3 -O /dev/null http://127.0.0.1:3000/healthz"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - sender-api

  db:
    image: supabase/postgres:17.6.1.136
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-supabase_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      POSTGRES_DB: sender_api
    restart: unless-stopped
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "test \"$$(head -n 1 /var/lib/postgresql/data/postmaster.pid 2>/dev/null)\" = 1 && pg_isready -U $${POSTGRES_USER:-supabase_admin} -d $${POSTGRES_DB:-sender_api}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - sender-api

  migrate:
    image: supabase/postgres:17.6.1.136
    environment:
      DATABASE_URL: ${MIGRATION_DATABASE_URL:-postgresql://${POSTGRES_USER:-supabase_admin}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@db:5432/sender_api}
    command:
      - bash
      - -ec
      - |
        ready=0
        for _ in $$(seq 1 30); do
          if psql "$$DATABASE_URL" -Atc 'SELECT 1' >/dev/null 2>&1; then
            case "$$DATABASE_URL" in
              *'@db:'*|*'@db/'*)
                # Supabase starts a temporary postmaster during first boot.
                # The final local server runs as PID 1; migrating against the
                # temporary server races its intentional shutdown.
                if test "$$(psql "$$DATABASE_URL" -Atc "SELECT split_part(pg_read_file('postmaster.pid'), E'\\n', 1)" 2>/dev/null)" = 1; then
                  ready=1
                  break
                fi
                ;;
              *)
                ready=1
                break
                ;;
            esac
          fi
          sleep 2
        done
        test "$$ready" -eq 1
        /opt/sender-api/scripts/migrate.sh
        test "$$(psql "$$DATABASE_URL" -Atc "SELECT CASE WHEN MAX(version) = 13 AND COUNT(*) FILTER (WHERE version = 13 AND NOT dirty) = 1 AND COUNT(*) FILTER (WHERE dirty) = 0 THEN '13|f' ELSE 'invalid' END FROM public.schema_migrations")" = '13|f'
    volumes:
      - ./scripts/migrate.sh:/opt/sender-api/scripts/migrate.sh:ro
      - ./migrations:/opt/sender-api/migrations:ro
    restart: "no"
    networks:
      - sender-api

  db-role:
    image: supabase/postgres:17.6.1.136
    environment:
      DATABASE_URL: ${MIGRATION_DATABASE_URL:-postgresql://${POSTGRES_USER:-supabase_admin}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@db:5432/sender_api}
      APP_DB_USER: ${APP_DB_USER:-sender_api_app}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?APP_DB_PASSWORD must be set}
    command:
      - bash
      - -ec
      - |
        psql "$$DATABASE_URL" -v ON_ERROR_STOP=1 \
          -v app_role="$$APP_DB_USER" -v app_password="$$APP_DB_PASSWORD" \
          -f /opt/sender-api/bootstrap-app-role.sql
    depends_on:
      migrate:
        condition: service_completed_successfully
    volumes:
      - ./bootstrap-app-role.sql:/opt/sender-api/bootstrap-app-role.sql:ro
    restart: "no"
    networks:
      - sender-api

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1"]
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - sender-api

volumes:
  postgres_data:
  redis_data:

networks:
  sender-api:
    driver: bridge
