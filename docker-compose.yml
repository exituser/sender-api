services:
  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    ports:
      - "8080:8080"
    environment:
      PORT: ${PORT:-8080}
      ENV: ${ENV:-development}
      DEBUG: ${DEBUG:-false}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      DATABASE_URL: postgresql://${POSTGRES_USER:-supabase_admin}:${POSTGRES_PASSWORD:-postgres}@db:5432/sender_api
      DB_MAX_CONNS: ${DB_MAX_CONNS:-4}
      DB_MIN_CONNS: ${DB_MIN_CONNS:-0}
      REDIS_URL: redis:6379
      REDIS_POOL_SIZE: ${REDIS_POOL_SIZE:-4}
      AWS_REGION: ${AWS_REGION:-eu-west-1}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_SES_CONFIGSET: ${AWS_SES_CONFIGSET:-}
      OUTBOUND_SES_TOPIC_ARN: ${OUTBOUND_SES_TOPIC_ARN:-}
      SUPABASE_URL: ${SUPABASE_URL:-http://localhost:54321}
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY:-}
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_TRACES_SAMPLE_RATE: ${SENTRY_TRACES_SAMPLE_RATE:-0}
      INBOUND_S3_BUCKET: ${INBOUND_S3_BUCKET:-sender-api-inbound}
      INBOUND_SQS_QUEUE_URL: ${INBOUND_SQS_QUEUE_URL:-}
      INBOUND_SNS_TOPIC_ARN: ${INBOUND_SNS_TOPIC_ARN:-}
      INBOUND_WEBHOOK_TOKEN: ${INBOUND_WEBHOOK_TOKEN:-}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: ${API_PIDS_LIMIT:-128}
    mem_limit: ${API_MEM_LIMIT:-512m}
    cpus: ${API_CPUS:-1.0}
    healthcheck:
      test: ["CMD-SHELL", "wget -q -T 3 -O /dev/null http://localhost:8080/readyz"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - sender-api

  worker:
    build:
      context: .
      dockerfile: docker/Dockerfile.worker
    environment:
      ENV: ${ENV:-development}
      DATABASE_URL: postgresql://${POSTGRES_USER:-supabase_admin}:${POSTGRES_PASSWORD:-postgres}@db:5432/sender_api
      DB_MAX_CONNS: ${DB_MAX_CONNS:-4}
      DB_MIN_CONNS: ${DB_MIN_CONNS:-0}
      REDIS_URL: redis:6379
      REDIS_POOL_SIZE: ${REDIS_POOL_SIZE:-4}
      WORKER_POLL_INTERVAL: ${WORKER_POLL_INTERVAL:-5s}
      AWS_REGION: ${AWS_REGION:-eu-west-1}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_SES_CONFIGSET: ${AWS_SES_CONFIGSET:-}
      OUTBOUND_SES_TOPIC_ARN: ${OUTBOUND_SES_TOPIC_ARN:-}
      INBOUND_S3_BUCKET: ${INBOUND_S3_BUCKET:-sender-api-inbound}
      INBOUND_SQS_QUEUE_URL: ${INBOUND_SQS_QUEUE_URL:-}
      INBOUND_SNS_TOPIC_ARN: ${INBOUND_SNS_TOPIC_ARN:-}
      INBOUND_WEBHOOK_TOKEN: ${INBOUND_WEBHOOK_TOKEN:-}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: ${WORKER_PIDS_LIMIT:-128}
    mem_limit: ${WORKER_MEM_LIMIT:-512m}
    cpus: ${WORKER_CPUS:-1.0}
    healthcheck:
      test: ["CMD-SHELL", "test \"$$(cat /proc/1/comm)\" = worker"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - sender-api

  web:
    build:
      context: web
      dockerfile: ../docker/Dockerfile.web
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8080
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:-http://localhost:54321}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY:-}
    ports:
      - "${WEB_HOST_PORT:-3000}:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8080
      NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:-http://localhost:54321}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY:-}
    depends_on:
      - api
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: ${WEB_PIDS_LIMIT:-128}
    mem_limit: ${WEB_MEM_LIMIT:-256m}
    cpus: ${WEB_CPUS:-0.25}
    healthcheck:
      test: ["CMD-SHELL", "wget -q -T 3 -O /dev/null http://127.0.0.1:3000/healthz"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - sender-api

  db:
    image: supabase/postgres:17.6.1.136
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-supabase_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: sender_api
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations/001_initial.up.sql:/docker-entrypoint-initdb.d/01_init.sql
      - ./migrations/003_hardening.up.sql:/docker-entrypoint-initdb.d/03_hardening.sql
      - ./migrations/004_inbound_mx.up.sql:/docker-entrypoint-initdb.d/04_inbound_mx.sql
      - ./migrations/compose-version.sql:/docker-entrypoint-initdb.d/05_compose_version.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-supabase_admin} -d $${POSTGRES_DB:-sender_api}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - sender-api

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - sender-api

volumes:
  postgres_data:
  redis_data:

networks:
  sender-api:
    driver: bridge
