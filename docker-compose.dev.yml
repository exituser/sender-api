services:
  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    ports:
      - "8080:8080"
    environment:
      PORT: ${PORT:-8080}
      ENV: ${ENV:-development}
      DEBUG: ${DEBUG:-true}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      DATABASE_URL: postgresql://${POSTGRES_USER:-supabase_admin}:${POSTGRES_PASSWORD:-postgres}@db:5432/sender_api
      DB_MAX_CONNS: ${DB_MAX_CONNS:-4}
      DB_MIN_CONNS: ${DB_MIN_CONNS:-0}
      REDIS_URL: redis:6379
      REDIS_POOL_SIZE: ${REDIS_POOL_SIZE:-4}
      AWS_REGION: ${AWS_REGION:-eu-west-1}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_SES_CONFIGSET: ${AWS_SES_CONFIGSET:-}
      OUTBOUND_SES_TOPIC_ARN: ${OUTBOUND_SES_TOPIC_ARN:-}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_PRICE_PRO: ${STRIPE_PRICE_PRO:-}
      STRIPE_PRICE_SCALE: ${STRIPE_PRICE_SCALE:-}
      STRIPE_SUCCESS_URL: ${STRIPE_SUCCESS_URL:-http://localhost:3000/settings/billing?success=1}
      STRIPE_CANCEL_URL: ${STRIPE_CANCEL_URL:-http://localhost:3000/settings/billing?cancelled=1}
      STRIPE_RETURN_URL: ${STRIPE_RETURN_URL:-http://localhost:3000/settings/billing}
      SUPABASE_URL: ${SUPABASE_URL:-http://localhost:54321}
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_TRACES_SAMPLE_RATE: ${SENTRY_TRACES_SAMPLE_RATE:-0}
      INBOUND_S3_BUCKET: ${INBOUND_S3_BUCKET:-sender-api-inbound}
      INBOUND_SQS_QUEUE_URL: ${INBOUND_SQS_QUEUE_URL:-}
      INBOUND_SNS_TOPIC_ARN: ${INBOUND_SNS_TOPIC_ARN:-}
      INBOUND_WEBHOOK_TOKEN: ${INBOUND_WEBHOOK_TOKEN:-}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -T 3 -O /dev/null http://localhost:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - sender-api

  worker:
    build:
      context: .
      dockerfile: docker/Dockerfile.worker
    environment:
      ENV: ${ENV:-development}
      DATABASE_URL: postgresql://${POSTGRES_USER:-supabase_admin}:${POSTGRES_PASSWORD:-postgres}@db:5432/sender_api
      DB_MAX_CONNS: ${DB_MAX_CONNS:-4}
      DB_MIN_CONNS: ${DB_MIN_CONNS:-0}
      REDIS_URL: redis:6379
      REDIS_POOL_SIZE: ${REDIS_POOL_SIZE:-4}
      WORKER_POLL_INTERVAL: ${WORKER_POLL_INTERVAL:-5s}
      WORKER_HEALTH_PORT: ${WORKER_HEALTH_PORT:-8090}
      AWS_REGION: ${AWS_REGION:-eu-west-1}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_SES_CONFIGSET: ${AWS_SES_CONFIGSET:-}
      OUTBOUND_SES_TOPIC_ARN: ${OUTBOUND_SES_TOPIC_ARN:-}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_PRICE_PRO: ${STRIPE_PRICE_PRO:-}
      STRIPE_PRICE_SCALE: ${STRIPE_PRICE_SCALE:-}
      STRIPE_SUCCESS_URL: ${STRIPE_SUCCESS_URL:-http://localhost:3000/settings/billing?success=1}
      STRIPE_CANCEL_URL: ${STRIPE_CANCEL_URL:-http://localhost:3000/settings/billing?cancelled=1}
      STRIPE_RETURN_URL: ${STRIPE_RETURN_URL:-http://localhost:3000/settings/billing}
      INBOUND_S3_BUCKET: ${INBOUND_S3_BUCKET:-sender-api-inbound}
      INBOUND_SQS_QUEUE_URL: ${INBOUND_SQS_QUEUE_URL:-}
      INBOUND_SNS_TOPIC_ARN: ${INBOUND_SNS_TOPIC_ARN:-}
      INBOUND_WEBHOOK_TOKEN: ${INBOUND_WEBHOOK_TOKEN:-}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -T 3 -O /dev/null http://127.0.0.1:$${WORKER_HEALTH_PORT:-8090}/readyz"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - sender-api

  web:
    build:
      context: web
      dockerfile: ../docker/Dockerfile.web
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8080
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:-http://localhost:54321}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY:-}
    ports:
      - "${WEB_HOST_PORT:-3000}:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8080
      NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:-http://localhost:54321}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY:-}
    depends_on:
      - api
    healthcheck:
      test: ["CMD-SHELL", "wget -q -T 3 -O /dev/null http://127.0.0.1:3000/healthz"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - sender-api

  db:
    image: supabase/postgres:17.6.1.136
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-supabase_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: sender_api
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations/001_initial.up.sql:/docker-entrypoint-initdb.d/01_init.sql
      - ./migrations/003_hardening.up.sql:/docker-entrypoint-initdb.d/03_hardening.sql
      - ./migrations/004_inbound_mx.up.sql:/docker-entrypoint-initdb.d/04_inbound_mx.sql
      - ./migrations/005_public_access_hardening.up.sql:/docker-entrypoint-initdb.d/05_public_access_hardening.sql
      - ./migrations/006_suppressions.up.sql:/docker-entrypoint-initdb.d/06_suppressions.sql
      - ./migrations/007_team_invitations.up.sql:/docker-entrypoint-initdb.d/07_team_invitations.sql
      - ./migrations/008_ses_domain_identity.up.sql:/docker-entrypoint-initdb.d/08_ses_domain_identity.sql
      - ./migrations/009_billing_state.up.sql:/docker-entrypoint-initdb.d/09_billing_state.sql
      - ./migrations/010_billing_event_ordering.up.sql:/docker-entrypoint-initdb.d/10_billing_event_ordering.sql
      - ./migrations/011_batch_manifest.up.sql:/docker-entrypoint-initdb.d/11_batch_manifest.sql
      - ./migrations/012_marketing_unsubscribe.up.sql:/docker-entrypoint-initdb.d/12_marketing_unsubscribe.sql
      - ./migrations/013_durable_delivery_pipeline.up.sql:/docker-entrypoint-initdb.d/13_durable_delivery_pipeline.sql
      - ./migrations/compose-version.sql:/docker-entrypoint-initdb.d/14_compose_version.sql
    healthcheck:
      # The Supabase image briefly starts a temporary postmaster while running
      # init scripts. Only PID 1 is the final server that application clients
      # may safely use.
      test: ["CMD-SHELL", "test \"$$(head -n 1 /var/lib/postgresql/data/postmaster.pid 2>/dev/null)\" = 1 && pg_isready -U $${POSTGRES_USER:-supabase_admin} -d $${POSTGRES_DB:-sender_api}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - sender-api

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - sender-api

volumes:
  postgres_data:
  redis_data:

networks:
  sender-api:
    driver: bridge
